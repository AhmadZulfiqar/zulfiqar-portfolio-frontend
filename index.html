<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO Title & Favicon -->
    <title>Zulfiqar Ahmad | Portfolio - Full Stack Developer &amp; Graphic Designer</title>
    <link rel="icon" type="image/png" href="/ZA-Logo.PNG" />

    <!-- Meta Tags for Search Engines -->
    <meta name="title" content="Zulfiqar Ahmad | Portfolio - Full Stack Developer" />
    <meta
      name="description"
      content="Official portfolio of Zulfiqar Ahmad, a Full Stack MERN Developer and Graphic Designer. Explore full-stack projects, UI layouts, and work experience."
    />
    <meta
      name="keywords"
      content="Zulfiqar, Zulfiqar Ahmad, Zulfiqar Portfolio, Zulfiqar Ahmad Portfolio, Full Stack Developer, MERN Stack Developer, Graphic Designer"
    />
    <meta name="author" content="Zulfiqar Ahmad" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL (Replace with your actual live Vercel domain) -->
    <link rel="canonical" href="https://your-portfolio.vercel.app/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-portfolio.vercel.app/" />
    <meta property="og:title" content="Zulfiqar Ahmad | Portfolio - Full Stack Developer" />
    <meta
      property="og:description"
      content="Where Logic Meets Aesthetics. Explore full-stack MERN projects, graphic design assets, and contact details for Zulfiqar Ahmad."
    />
    <meta property="og:image" content="https://your-portfolio.vercel.app/ZA-Logo.PNG" />

    <!-- Twitter Cards -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://your-portfolio.vercel.app/" />
    <meta property="twitter:title" content="Zulfiqar Ahmad | Portfolio - Full Stack Developer" />
    <meta
      property="twitter:description"
      content="Where Logic Meets Aesthetics. Explore full-stack MERN projects and graphic design assets."
    />
    <meta property="twitter:image" content="https://your-portfolio.vercel.app/ZA-Logo.PNG" />

    <!-- Font Awesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />

    <!-- Google Structured Data (Schema.org) for Personal Brand Ranking -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Zulfiqar Ahmad",
        "url": "https://your-portfolio.vercel.app/",
        "jobTitle": "Full Stack Developer",
        "sameAs": [
          "https://github.com/ahmadzulfiqar",
          "https://www.linkedin.com/in/zulfiqar-ahmad-08586b299"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
